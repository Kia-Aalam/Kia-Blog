{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="{% static "css/login.css" %}">
    <link rel="stylesheet" href="{% static "css/login_message.css" %}">
  </head>
  <body>

    {% if messages %}
      {% for message in messages %}
      <div id="customAlert" class="custom-alert-overlay">
          <div class="custom-alert-box">
              <p class="custom-alert-title">Login failed</p>
              <p class="custom-alert-text">{{ message }}</p>
              <div class="custom-alert-actions">
                  <button class="custom-alert-btn" onclick="document.getElementById('customAlert').style.display='none'">OK</button>
              </div>
          </div>
      </div>
      {% endfor %}
    {% endif %}
    
    <div class="wrapper">
      <div class="title-text">
        <div class="title login">Login Form</div>
        <div class="title signup">Signup Form</div>
      </div>
      <div class="form-container">
        <div class="slide-controls">
          <input type="radio" name="slide" id="login" checked />
          <input type="radio" name="slide" id="signup" />
          <label for="login" class="slide login">Login</label>
          <label for="signup" class="slide signup">Signup</label>
          <div class="slider-tab"></div>
        </div>
        <div class="form-inner">
          <form class="login" method="post">
            {% csrf_token %}
            <div class="field">
              <input type="text" name="username" placeholder="User Name" required />
            </div>
            <div class="field">
              <input type="password" name="password" placeholder="Password" required />
            </div>
            <div class="pass-link"><a href="#">Forgot password?</a></div>
            <div class="field btn">
              <div class="btn-layer"></div>
              <input type="submit" value="Login" name="login" />
            </div>
            <div class="signup-link">
              Not a member? <a href="">Signup now</a>
            </div>
            <div class="signup-link">
              Back to home page? <a href="{% url 'home' %}">Home</a>
            </div>
          </form>
          <!-- Signup -->
          <form class="signup" method="post">
            {% csrf_token %}
            <div class="field">
              <input type="text" name="username_su" placeholder="User Name" required />
            </div>
            <div class="field">
              <input type="password" name="password_su" placeholder="Password" required />
            </div>
            <div class="field">
              <input type="password" name="password_2_su" placeholder="Confirm password" required />
            </div>
            <div class="field btn">
              <div class="btn-layer"></div>
              <input type="submit" value="Signup" name="signup" />
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="{% static "js/login.js" %}" ></script>
  </body>
</html>
